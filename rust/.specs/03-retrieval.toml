# Spec 03 — Retrieval Pipeline
# One search tool, layered lexical retrieval, frecency-aware ranking, token-budgeted output.

[spec]
id = "retrieval"
version = "0.1.0"
status = "draft"

[pipeline]
stages = [
  "1. Parse query with fff-query-parser.",
  "2. Run concurrently: (a) fffind over paths/slugs (titles are slugs, so this is title search); (b) plain-mode grep over note content — frontmatter included, so aliases and tags match here. A backend failure propagates with its stage, query, and scope.",
  "3. Escalate: if merged results < min_results (default 3), rerun grep in fuzzy mode.",
  "4. Merge and dedupe by (namespace, slug); a note matching in both stages takes the max base component score plus one both-stages bonus, and snippet/why provenance comes from the highest-scoring content component (longer snippet breaks score ties).",
  "5. Rank: final = match_score * frecency_multiplier (see [ranking]).",
  "6. Shape output under the token budget (see [output]).",
]
scope = "namespace argument narrows to a subtree; absent = whole root; .archive/ excluded unless include_archived = true"
scope_application = "namespace constraints use a root-anchored, literal-escaped namespace/** glob inside fff before pagination for both find and grep; returned paths are post-filtered at the literal root-prefix boundary as a defense; archived search uses a short-lived synchronous picker rooted at .archive/ and restores the .archive/ storage prefix only on returned paths"
fuzzy_query_limit = "memory-index rejects fuzzy queries longer than 80 UTF-8 bytes before calling fff 0.10.3, whose score arithmetic overflows above that bound; callers should use 2-3 key terms"
archive_collisions = "an active note shadows the archived note with the same logical namespace/slug even when only archived content matched; if both storage paths are returned, they dedupe to the active note"

[ranking]
match_score = "memory-index rejects weak native filename-fuzzy hits using raw fff base score before that signal is discarded, then each retained backend result page normalizes its native score to 0.0..=1.0 before merge; merged notes take the max component plus the both-stages bonus"
fuzzy_confidence = "the backend-neutral merge scales fuzzy-grep components to 0.95 so escalation expands recall without displacing an equal-score plain match; path and plain components remain unscaled, and the existing path-plus-content bonus is applied afterward"
filename_confidence = "the pre-normalization filename gate is backend-specific and therefore stays inside memory-index, the only fff-aware crate; its corpus-calibrated floor is 2 * the alphanumeric query length, while exact/plain/fuzzy content retrieval remains unchanged"
frecency_multiplier = "derived from the access log as read + 0.25 * search_hit (see 05-lifecycle.toml); recently/frequently retrieved notes rank higher"
type_boosts = "small static boosts: preference and decision outrank session-summary at equal match score"
prose_caveat = """
fff scoring heuristics are code-tuned (definition classification, filename
bonuses). The checked-in prose corpus validates them continuously. We keep our
own thin re-rank layer (steps 4-5) for backend-neutral ordering corrections;
quality gates that require native score components run in memory-index before
normalization discards those components.
"""

[output]
philosophy = "snippet-first, expand-on-demand; the context window is the scarce resource"
budget_bytes_default = 4096
budget_bytes_max = 16384
budget_accounting = "budget_bytes applies only to the sum of exact serde_json-serialized full result entries; explicit 0 admits no full results, values above the max clamp to the max, and an oversized first result is never force-admitted"
per_result = [
  "namespace/slug (the handle for memory_read)",
  "title",
  "snippet: first matching line(s) with minimal context, not the whole body",
  "why: one compact line, e.g. 'alias:shipping +frecency(3r+8s/30d)' — explainable retrieval",
  "score",
]
why_provenance = "content matches retain their 1-based matched line and structurally classified frontmatter/body field through merge and rank; alias why text names the alias that actually matched, including later block-list aliases"
overflow = "limit caps admitted full results, so an oversized candidate does not consume a limit slot; results not admitted by the limit or snippet budget are returned as bare slug+title lines under a 'more' key; more entries are outside budget_bytes"
reinforcement = "append lightweight search_hit access events only for handles present in shaped results, never for more or other overflow; backend frecency is reinforced once when memory_read selects an active indexed note, while archived reads remain reinforced by the authoritative access log"
no_silent_empty = """
An empty result set must say what was tried: stages run, scope searched, and a
hint ('try broader terms or namespace=\"\"'). The predecessor failed silently
past its threshold; this design treats empty results as a reportable outcome,
never a silent one.
"""

[iterability]
note = """
Lexical search is iterable by design: the agent can reformulate and re-query
cheaply (microseconds, no API cost). Tool description should encourage 2-3
query variants before concluding a memory does not exist. This loop replaces
most of what one-shot semantic similarity provided.
"""

[read_tool]
memory_read = "takes namespace/slug, prefers the active note and falls back to the archived note when active is absent; returns full frontmatter + body; records an access event (reinforcement); may include one-hop [[link]] titles as breadcrumbs (phase 3)"
