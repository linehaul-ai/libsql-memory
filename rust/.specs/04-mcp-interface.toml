# Spec 04 — MCP Interface
# Five tools, stdio transport, JSON-RPC 2.0. Small on purpose.

[spec]
id = "mcp-interface"
version = "0.1.0"
status = "draft"

[server]
transport = "stdio"
protocol = "MCP JSON-RPC 2.0"
sdk = "official Rust MCP SDK (rmcp) — do not hand-roll the protocol layer like the predecessor did"
logging = "stderr only; stdout is reserved for the protocol"
name = "fff-memory"
wire_evidence = "MemoryServer::serve over tokio::io::duplex proves initialize, notifications/initialized, tools/list, all five tool calls, and structured errors; initialize and tools/list are checked against complete JSON goldens"

# --- Tools ---

[[tool]]
name = "memory_store"
summary = "Store or update a memory. Never fails for search-related reasons."
args = [
  "title: string (required)",
  "body: string (required)",
  "aliases: string[] (required, min 2) — synonyms/alternate phrasings a future query might use",
  "namespace: string (default 'default')",
  "type: fact|decision|preference|lesson|reference|session-summary (required)",
  "tags: string[] (optional)",
  "expires: YYYY-MM-DD (optional)",
  "mode: append|replace (default append) — how to merge if dedup finds an existing note",
]
returns = "{ slug, namespace, action: created|updated, dedup_hit }"
description_guidance = "Tool description must instruct the model to write aliases in the vocabulary of future questions, not restatements of the title."

[[tool]]
name = "memory_search"
summary = "Layered lexical search (see 03-retrieval.toml). Returns ranked snippets with handles and a 'why' per result."
args = [
  "query: string (required)",
  "namespace: string (optional; absent = all)",
  "limit: uint32 (schema minimum 0, default 8; runtime 0 selects the default)",
  "budget_bytes: uint32 (schema minimum 0, default 4096, max 16384; runtime clamps values above the max)",
  "include_archived: bool (default false)",
]
returns = "{ results: [{ handle, title, snippet, why, score }], more: [handle+title], stages_run, scope }"
description_guidance = "Description encourages 2-3 reformulations before concluding no memory exists."

[[tool]]
name = "memory_read"
summary = "Fetch one full note by handle; records an access event (frecency reinforcement)."
args = ["handle: string 'namespace/slug' (required)"]
returns = "{ frontmatter, body, linked: [handle+title] }"

[[tool]]
name = "memory_forget"
summary = "Archive (default) or hard-delete a note."
args = [
  "handle: string (required)",
  "hard: bool (default false) — false moves the active note to .archive/; true removes the active note, falling back to its archived note only when active is absent",
]
returns = "{ handle, action: archived|deleted }"

[[tool]]
name = "memory_stats"
summary = "Store health: counts by namespace and type, disk size, index status, access-log summary, notes nearing expiry."
args = ["namespace: string (optional)"]
returns = "{ total_notes, by_namespace, by_type, disk_bytes, index: {state, files_indexed, last_scan_ms}, decay: {never_accessed_30d, expiring_soon} }"

[cli]
commands = "exactly: fff-memory serve|store|search|read|forget|stats|doctor|reindex"
global_args = "--root PATH, --config PATH, --project [PATH]; accepted before or after subcommands; --project conflicts only with explicit --root. Because clap optional values consume the following token, use the documented bare form after required positionals (search QUERY --project) and use --project=PATH to disambiguate an explicit path; serve --project PATH remains supported."
store = "required --title, --body, --type, and at least two repeated --alias; optional --namespace (default default), repeated --tag, --expires YYYY-MM-DD, --mode append|replace"
search = "required positional QUERY; optional --namespace, --limit, --budget, --include-archived"
read_forget_stats = "read HANDLE; forget HANDLE [--hard]; stats [--namespace]"
output = "store/search/read/forget/stats each emit exactly one JSON object plus newline on stdout; diagnostics go only to stderr; doctor/reindex remain human-readable"
root_error = "a root that cannot be created names the resolved path and directs the user to choose a writable directory or remove a conflicting file; JSON-command stdout remains empty"
implementation = "one async clap entry point resolves and creates the root, then reuses MemoryService, MemoryServer, and serve_stdio; read/forget do not start the index"
retrieval_failure = "serve/store/search/stats attempt FffRetriever startup; failure emits one stderr diagnostic and continues without retrieval. Store remains independent; search returns no results, no falsely claimed stages, and actionable index-unavailable guidance; stats reports unavailable."
stdio_evidence = "a spawned binary test proves initialize, initialized, tools/list, store, watcher-polled search, and read with bounded waits, graceful stdin EOF, kill fallback, and JSON-only stdout"

[errors]
style = "structured, actionable, never silent; every error names the failing input and a fix"
example = "namespace 'a/../b' rejected: path traversal; use a relative subtree like 'projects/tms'"
filesystem_boundary = "Store, read, forget, stats, search-hit loading, archive access, index access, and lifecycle actions never follow symlink components below the configured memory root; direct operations return an actionable path error and recursive reports skip symlink entries."
filesystem_trust = "This guarantee assumes no hostile concurrent replacement inside the locally trusted root; reusable access-log paths are validated on their first filesystem operation per service instance, while note/index paths are validated at operation time. This is not race-proof like descriptor-relative openat/openat2 with no-follow flags."

[schema_contract]
aliases = "required array with minItems 2; runtime validation enforces the same minimum"
limit = "minimum 0 and default 8; no application-specific maximum"
budget_bytes = "minimum 0, default 4096, maximum 16384; explicit zero is valid"
