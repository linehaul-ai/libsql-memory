# Spec 08 — Roadmap, Risks, Open Questions

[spec]
id = "roadmap"
version = "0.1.0"
status = "draft"

# --- Phases ---

[[phase]]
n = 1
name = "Core loop, dogfood immediately"
scope = [
  "memory-core: note format, atomic store, slugify, access log",
  "memory-index: FffRetriever over the fff crates",
  "memory-mcp: memory_store / memory_search / memory_read over rmcp",
  "fff-memory bin: serve + store + search + read subcommands",
  "end-to-end smoke test in CI",
]
exit_criteria = "Real memories stored and retrieved in daily Claude Code use; retrieval *feel* judged on a corpus of 20+ hand-written notes. Feel cannot be computed — this phase exists to measure it."
implementation_status = "COMPLETE 2026-08-09"
implementation_evidence = "Property tests cover slug and full-note round trips; a deterministic 20-note prose corpus proves store -> real fff index -> layered search -> read, title/alias/typo recall, namespace scope, archive behavior, type/frecency boosts, and explicit empty guidance; spawned rmcp stdio tests prove the process boundary."
performance_evidence = "An explicit ignored release-mode gate seeds 2,000 notes and verifies the overview's cold-start and warm-search p50 targets without putting machine-sensitive timing assertions in normal CI."
acceptance_status = "PENDING REAL USE: the checked-in corpus is reproducible engineering evidence, not 20+ hand-written daily-use memories or a subjective retrieval-feel judgment."

[[phase]]
n = 2
name = "Automation & write quality"
scope = [
  "dedup-on-write probe with append|replace modes",
  "memory_forget + memory_stats",
  "hooks (SessionStart, UserPromptSubmit, Stop) + memory-usage skill + plugin packaging",
  "alias-quality validation in doctor",
]
exit_criteria = "Memory accumulates and surfaces without manual tool calls across one week of real sessions."
implementation_status = "COMPLETE 2026-08-09"
implementation_evidence = "Dedup store modes, forget/stats, alias-quality doctor checks, portable plugin packaging, and three fail-open hooks are covered by unit, package, and wire tests. Stop writes require the plugin-scoped memory_store permission to be pre-approved; otherwise the hook skips without blocking the session."
acceptance_status = "PENDING ELAPSED USE: one week of real automated sessions has not occurred."

[[phase]]
n = 3
name = "Lifecycle & polish"
scope = [
  "doctor decay sweeps + .archive/ + access-log compaction",
  "wikilink breadcrumbs in memory_read",
  "explainable-'why' refinement from dogfood feedback; prose re-rank corrections",
  "stats decay-health metrics; git commit-message suggestions",
]
exit_criteria = "Store stays healthy unattended: decay candidates surface, archive works, no hoarding."
implementation_status = "COMPLETE 2026-08-09"
implementation_evidence = "Lifecycle tests prove strict access-log authority, weighted reinforcement, compaction recovery/concurrency, decay candidates, archive/read behavior, wikilink breadcrumbs, explainable ranking, decay-health stats, and doctor commit-message suggestions."
acceptance_status = "PENDING UNATTENDED USE: tests prove mechanisms, not long-running no-hoarding behavior."

# --- Risks ---

[[risk]]
id = "R-1"
name = "fff is young and single-maintainer"
mitigation = "pin exact versions; confine all fff imports to memory-index; Retriever trait keeps the backend swappable; vendor the crates if upstream churn bites"

[[risk]]
id = "R-2"
name = "fff scoring is code-tuned, corpus is prose markdown"
mitigation = "own re-rank layer on top of raw scores; the deterministic 20-note corpus catches prose-ordering regressions, while daily-use acceptance remains required before declaring the risk retired"

[[risk]]
id = "R-3"
name = "alias quality is load-bearing; lazy aliases sink recall"
mitigation = "min-2 aliases enforced by the tool schema; skill teaches future-question vocabulary; doctor flags thin aliases; snippet 'why' output makes weak aliases visible in use"

[[risk]]
id = "R-4"
name = "hook fatigue (what killed the predecessor's automation)"
mitigation = "thin hooks per 07-hooks-automation.toml; hooks ship as versioned plugin files; system degrades to manual use instead of breaking"

[[risk]]
id = "R-5"
name = "concurrent sessions racing on one note"
mitigation = "atomic rename = last-writer-wins per note; acceptable for v1; git surfaces any lost update in history"

# --- Open questions ---

[[open_question]]
id = "OQ-1"
q = "Does fff's internal frecency persist across restarts when embedded as a library, and can we feed our access events into it?"
status = "RESOLVED 2026-08-09"
answer = "Yes: FrecencyTracker and QueryTracker are LMDB-backed databases opened at paths we choose (place under .index/); they persist across restarts. Init them before FilePicker::new_with_shared_state. Our access log remains the lifecycle/decay authority per 05-lifecycle.toml."

[[open_question]]
id = "OQ-2"
q = "How does fff scoring behave on frontmatter-heavy prose? Do alias lines match well in plain grep, and does fuzzy mode over-match on YAML syntax?"
status = "RESOLVED 2026-08-09"
answer = "The deterministic 20-note prose corpus proves exact title, alias-only plain grep, typo-tolerant fuzzy grep, namespace, archive, type, and frecency ordering through the real backend. It exposed a weak single-result filename fuzzy match being normalized to 1.0; memory-index now rejects filename matches below a query-length confidence floor before backend-neutral normalization. Frontmatter provenance tests cover inline/block aliases, tags, titles, BOM notes, and body text. Subjective feel still requires the Phase 1 real-use exit criterion."

[[open_question]]
id = "OQ-3"
q = "rmcp SDK maturity: does it cleanly support our stdio + five-tool shape?"
status = "RESOLVED 2026-08-09"
answer = "Yes. The official rmcp 3.1.2 service runs MemoryServer's exact five-tool contract over its async read/write transport. A real tokio duplex JSON-RPC test proves initialization, notification handling, discovery schemas, all tool calls, and actionable errors; checked-in initialize and tools/list goldens preserve the wire contract."

[[open_question]]
id = "OQ-4"
q = "Migration: seed the new store from the user's existing global markdown memory (~/.claude/.../memory/)? Their format is nearly identical (frontmatter + body + [[links]])."
status = "NO FOR V1 2026-08-09"
answer = "Do not add an import subcommand in v1. The source and destination are compatible markdown notes, so a deliberate file copy is sufficient if migration is wanted; product code would add a destructive/path-sensitive surface without improving the core loop."

[[open_question]]
id = "OQ-5"
q = "What happens to this repo? Proposal: new Rust workspace lives in rust/, Go tree and committed binaries removed once phase 1 dogfooding sticks."
status = "RESOLVED 2026-08-15"
answer = "The user authorized deletion. The Go tree, committed binaries, legacy databases, launcher, and architecture diagrams were removed across commits d996784..HEAD on refactor/rust (binaries, Go source, launcher/data, docs/diagrams, doc edits). Nothing was rewritten out of history: `main` is an ancestor of this branch and remains the recovery point — `git checkout main -- <path>` restores any deleted file, and the diagrams (which never existed on `main`) are recoverable via `git show 7599f0e:diagrams/<file>`. Reclaiming the ~101.7 MB of blobs still in the pack files would require a history rewrite and is deliberately deferred until after refactor/rust merges. With the Go tree gone, the workspace was then lifted out of rust/ into the repository root on 2026-08-15: Cargo.toml, Cargo.lock, crates/, and .specs/ now sit at the root beside the plugin wiring, so the Cargo workspace and the Claude plugin package are the same directory."
